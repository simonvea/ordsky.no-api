<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }
    </style>
  </head>
  <body>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
    <form id="words-form">
      <input id="words" />
      <button>Send</button>
    </form>
    <section id="words-added"></section>
    <section id="entries"></section>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const socket = io();
      socket.onAny((m) => console.log(m));

      let id = "";

      const form = document.getElementById("form");
      const input = document.getElementById("input");

      const wordsForm = document.getElementById("words-form");
      const words = document.getElementById("words");
      const wordsAddedElem = document.getElementById("words-added");
      const entriesElem = document.getElementById("entries");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value) {
          id = input.value;
          socket.emit("create-session", { id: input.value });
          input.value = "";
        }
      });

      wordsForm.addEventListener("submit", (e) => {
        e.preventDefault();

        if (words.value) {
          socket.emit("add-words", { id, words: words.value });
          words.value = "";
        }
      });

      socket.on("words-added", ({ words, numberOfEntries }) => {
        console.log("words-added", words, numberOfEntries);
        entries.innerHTML = numberOfEntries;
        const ul = document.createElement("ul");

        words.forEach((word) => {
          const li = document.createElement("li");
          const content = document.createTextNode(word);
          li.appendChild(content);
          ul.appendChild(li);
        });

        wordsAddedElem.replaceChildren(ul);
      });
    </script>
  </body>
</html>
